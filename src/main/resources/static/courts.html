<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pickleball Matchmaking</title>
    <style>
        :root {
            --primary: #15803d;
            --primary-hover: #166534;
            --primary-light: #f0fdf4;
            --primary-border: #86efac;
            --surface: #ffffff;
            --bg: #f8fafc;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border: #e2e8f0;
            --danger: #ef4444;
            --danger-hover: #dc2626;
            --danger-light: #fef2f2;
            --shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
            --radius: 12px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text-main);
            padding: 16px;
            padding-bottom: 80px;
            max-width: 1024px;
            margin: 0 auto;
        }

        /* Header Bar */
        .app-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 12px;
            background: var(--surface);
            padding: 16px 20px;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            margin-bottom: 16px;
        }

        .title-group h1 {
            font-size: 1.4rem;
            font-weight: 800;
            color: var(--primary);
            letter-spacing: -0.5px;
        }

        .title-group p {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-top: 2px;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .round-badge {
            background: var(--primary);
            color: white;
            font-size: 1rem;
            font-weight: 700;
            padding: 8px 16px;
            border-radius: 999px;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            box-shadow: 0 2px 4px rgba(21, 128, 61, 0.3);
        }

        .btn-reset {
            background: transparent;
            color: var(--danger);
            border: 1px solid var(--danger);
            padding: 8px 14px;
            border-radius: 8px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.15s ease;
        }

        .btn-reset:hover, .btn-reset:active {
            background: var(--danger-light);
        }

        /* Floating / Sticky Control Bar */
        .action-banner {
            display: flex;
            gap: 12px;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 16px;
            background: var(--surface);
            padding: 12px 16px;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
        }

        .btn-rotate {
            background: var(--primary);
            color: white;
            border: none;
            padding: 14px 24px;
            border-radius: 10px;
            font-size: 1.05rem;
            font-weight: 700;
            cursor: pointer;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            box-shadow: 0 4px 10px rgba(21, 128, 61, 0.35);
            transition: transform 0.1s ease, background-color 0.15s ease;
        }

        .btn-rotate:hover {
            background: var(--primary-hover);
        }

        .btn-rotate:active {
            transform: scale(0.98);
        }

        /* Error Notification */
        .alert-error {
            background: var(--danger-light);
            border: 1px solid #fecaca;
            color: var(--danger-hover);
            padding: 12px 16px;
            border-radius: 8px;
            margin-bottom: 16px;
            font-size: 0.9rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* Courts Grid */
        .courts-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 16px;
            margin-bottom: 24px;
        }

        @media (min-width: 680px) {
            .courts-grid {
                grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            }
        }

        /* Court Card */
        .court-card {
            background: var(--surface);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            transition: box-shadow 0.2s ease;
        }

        .court-card:hover {
            box-shadow: 0 8px 16px -2px rgb(0 0 0 / 0.1);
        }

        .court-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 16px;
            background: #f1f5f9;
            border-bottom: 1px solid var(--border);
        }

        .court-title {
            font-size: 1.05rem;
            font-weight: 700;
            color: var(--text-main);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .btn-delete-court {
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            padding: 6px;
            border-radius: 6px;
            font-size: 0.85rem;
            display: flex;
            align-items: center;
            transition: all 0.15s ease;
        }

        .btn-delete-court:hover {
            color: var(--danger);
            background: var(--danger-light);
        }

        .court-matchup {
            padding: 14px 16px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .tap-prompt {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--text-muted);
            font-weight: 700;
            text-align: center;
            margin-bottom: 2px;
        }

        /* Interactive Team Tap Targets */
        .team-btn {
            background: var(--bg);
            border: 2px solid var(--border);
            border-radius: 10px;
            padding: 12px 14px;
            text-align: left;
            cursor: pointer;
            transition: all 0.15s ease;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: relative;
            min-height: 64px;
            user-select: none;
        }

        .team-btn:active {
            transform: scale(0.99);
        }

        .team-info {
            display: flex;
            flex-direction: column;
            gap: 3px;
        }

        .team-label {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-weight: 700;
            color: var(--text-muted);
        }

        .team-players {
            font-size: 1.05rem;
            font-weight: 600;
            color: var(--text-main);
        }

        .winner-pill {
            font-size: 0.75rem;
            font-weight: 700;
            color: var(--text-muted);
            border: 1px solid var(--border);
            padding: 4px 8px;
            border-radius: 999px;
            background: var(--surface);
            display: flex;
            align-items: center;
            gap: 4px;
        }

        /* Selected Winner State */
        .team-btn.winner {
            background: var(--primary-light);
            border-color: var(--primary);
            box-shadow: 0 0 0 2px rgba(21, 128, 61, 0.15);
        }

        .team-btn.winner .team-label {
            color: var(--primary);
        }

        .team-btn.winner .team-players {
            color: var(--primary-hover);
            font-weight: 700;
        }

        .team-btn.winner .winner-pill {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }

        .vs-divider {
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.75rem;
            font-weight: 800;
            color: var(--text-muted);
            letter-spacing: 1px;
            margin: -2px 0;
        }

        /* Reserves Footer */
        .court-reserves {
            padding: 10px 16px;
            background: #f8fafc;
            border-top: 1px solid var(--border);
            font-size: 0.85rem;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        .reserves-tag {
            background: #e2e8f0;
            color: #334155;
            padding: 2px 8px;
            border-radius: 999px;
            font-size: 0.8rem;
            font-weight: 600;
        }

        /* Empty State */
        .empty-courts {
            background: var(--surface);
            border: 2px dashed var(--border);
            border-radius: var(--radius);
            padding: 40px 20px;
            text-align: center;
            color: var(--text-muted);
            grid-column: 1 / -1;
        }

        .empty-courts h3 {
            color: var(--text-main);
            margin-bottom: 6px;
        }

        /* Add Court Section (Collapsible Accordion / Card) */
        .add-court-card {
            background: var(--surface);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
            padding: 18px 20px;
            margin-top: 20px;
        }

        .add-court-header {
            font-size: 1.15rem;
            font-weight: 700;
            color: var(--text-main);
            margin-bottom: 14px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 16px;
        }

        @media (min-width: 600px) {
            .form-grid {
                grid-template-columns: 1fr 1fr;
            }
        }

        .form-section {
            background: #f8fafc;
            padding: 14px;
            border-radius: 8px;
            border: 1px solid var(--border);
        }

        .form-section h4 {
            font-size: 0.9rem;
            font-weight: 700;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 10px;
        }

        .form-group {
            margin-bottom: 10px;
        }

        .form-group:last-child {
            margin-bottom: 0;
        }

        .form-group label {
            display: block;
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--text-muted);
            margin-bottom: 4px;
        }

        .form-group input {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid var(--border);
            border-radius: 6px;
            font-size: 0.95rem;
            color: var(--text-main);
            outline: none;
            transition: border-color 0.15s ease;
        }

        .form-group input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(21, 128, 61, 0.1);
        }

        /* Reserves Form Section */
        .reserves-inputs {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 10px;
        }

        .reserve-row {
            display: flex;
            gap: 6px;
        }

        .reserve-row input {
            flex: 1;
            padding: 8px 12px;
            border: 1px solid var(--border);
            border-radius: 6px;
            font-size: 0.9rem;
        }

        .btn-remove-reserve {
            background: none;
            border: 1px solid var(--border);
            color: var(--text-muted);
            padding: 0 10px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }

        .btn-remove-reserve:hover {
            color: var(--danger);
            border-color: var(--danger);
        }

        .btn-add-reserve {
            background: white;
            border: 1px dashed var(--primary);
            color: var(--primary);
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
            width: 100%;
            transition: background 0.15s ease;
        }

        .btn-add-reserve:hover {
            background: var(--primary-light);
        }

        .btn-submit-court {
            background: #0f172a;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            width: 100%;
            margin-top: 14px;
            transition: background 0.15s ease;
        }

        .btn-submit-court:hover {
            background: #1e293b;
        }
    </style>
</head>
<body>

    <!-- App Header Bar -->
    <header class="app-header">
        <div class="title-group">
            <h1>Pickleball Rotation</h1>
            <p>Practice Ladder & Doubles Matchmaking</p>
        </div>
        <div class="header-actions">
            <span class="round-badge">Round <span id="roundNumber">1</span></span>
            <button type="button" id="resetSessionBtn" class="btn-reset" title="Reset all courts and round counter">Reset Session</button>
        </div>
    </header>

    <!-- Error Alert Banner -->
    <div id="errorMessage" class="alert-error" hidden></div>

    <!-- Rotation Controls -->
    <div class="action-banner">
        <form id="nextMatchesForm" style="width: 100%;">
            <button type="submit" class="btn-rotate">
                <span>🔄 Rotate to Next Matches</span>
            </button>
        </form>
    </div>

    <!-- Responsive Courts Cards Container -->
    <main class="courts-grid" id="courtsContainer">
        <!-- Court Cards rendered dynamically by JS -->
    </main>

    <!-- Add Court Form Card -->
    <section class="add-court-card">
        <div class="add-court-header">
            <span>➕ Add a New Court</span>
        </div>
        <form id="addCourtForm">
            <div class="form-grid">
                <!-- Team 1 -->
                <div class="form-section">
                    <h4>Team 1</h4>
                    <div class="form-group">
                        <label for="team1Player1">Player 1</label>
                        <input type="text" id="team1Player1" required placeholder="e.g. Alice">
                    </div>
                    <div class="form-group">
                        <label for="team1Player2">Player 2</label>
                        <input type="text" id="team1Player2" required placeholder="e.g. Bob">
                    </div>
                </div>

                <!-- Team 2 -->
                <div class="form-section">
                    <h4>Team 2</h4>
                    <div class="form-group">
                        <label for="team2Player1">Player 1</label>
                        <input type="text" id="team2Player1" required placeholder="e.g. Charlie">
                    </div>
                    <div class="form-group">
                        <label for="team2Player2">Player 2</label>
                        <input type="text" id="team2Player2" required placeholder="e.g. David">
                    </div>
                </div>
            </div>

            <!-- Reserves -->
            <div class="form-section" style="margin-top: 14px;">
                <h4>Reserves / Bench (Optional)</h4>
                <div class="reserves-inputs" id="reservesInputs">
                    <div class="reserve-row">
                        <input type="text" class="reservePlayer" placeholder="Reserve player name">
                    </div>
                </div>
                <button type="button" id="addReserveBtn" class="btn-add-reserve">+ Add Another Reserve</button>
            </div>

            <button type="submit" class="btn-submit-court">Add Court to Ladder</button>
        </form>
    </section>

    <script>
        const API_BASE_URL = '/courts';

        function showError(message) {
            const el = document.getElementById('errorMessage');
            if (!message) {
                el.hidden = true;
                el.textContent = '';
                return;
            }
            el.hidden = false;
            el.textContent = '⚠️ ' + message;
        }

        async function readError(response, fallback) {
            try {
                const body = await response.json();
                return body.message || body.detail || fallback;
            } catch {
                return fallback;
            }
        }

        function formatReservesTags(reserves) {
            if (!reserves || reserves.length === 0) {
                return '<span style="color:#94a3b8; font-style: italic;">None</span>';
            }
            const arr = Array.isArray(reserves) ? reserves : [reserves];
            return arr.map(name => `<span class="reserves-tag">${escapeHtml(name)}</span>`).join('');
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text == null ? '' : String(text);
            return div.innerHTML;
        }

        async function loadRound() {
            try {
                const res = await fetch(`${API_BASE_URL}/round`);
                if (res.ok) {
                    const data = await res.json();
                    document.getElementById('roundNumber').textContent = data.round;
                }
            } catch {
                // ignore
            }
        }

        async function loadCourts() {
            await loadRound();
            const res = await fetch(API_BASE_URL);
            if (!res.ok) {
                showError(await readError(res, 'Could not load courts'));
                return;
            }
            const courts = await res.json();
            const container = document.getElementById('courtsContainer');

            if (courts.length === 0) {
                container.innerHTML = `
                    <div class="empty-courts">
                        <h3>No Active Courts</h3>
                        <p>Add your first court below to start the practice rotation.</p>
                    </div>
                `;
                showError('');
                return;
            }

            container.innerHTML = courts.map((court, index) => {
                const t1Winner = court.team1Win;
                const t2Winner = court.team2Win;

                return `
                    <article class="court-card" data-court-id="${court.id}">
                        <div class="court-header">
                            <span class="court-title">
                                🎾 Court ${index + 1}
                            </span>
                            <button type="button" class="btn-delete-court" data-court-id="${court.id}" title="Remove this court">
                                ✕ Delete
                            </button>
                        </div>

                        <div class="court-matchup">
                            <div class="tap-prompt">Tap winning team to record result</div>

                            <!-- Team 1 Card Tap Target -->
                            <div class="team-btn ${t1Winner ? 'winner' : ''}" data-team="team1" role="button" tabindex="0">
                                <div class="team-info">
                                    <span class="team-label">Team 1</span>
                                    <span class="team-players">${escapeHtml(court.team1.player1)} &amp; ${escapeHtml(court.team1.player2)}</span>
                                </div>
                                <span class="winner-pill">
                                    ${t1Winner ? '🏆 WINNER' : 'Select'}
                                </span>
                            </div>

                            <div class="vs-divider">VS</div>

                            <!-- Team 2 Card Tap Target -->
                            <div class="team-btn ${t2Winner ? 'winner' : ''}" data-team="team2" role="button" tabindex="0">
                                <div class="team-info">
                                    <span class="team-label">Team 2</span>
                                    <span class="team-players">${escapeHtml(court.team2.player1)} &amp; ${escapeHtml(court.team2.player2)}</span>
                                </div>
                                <span class="winner-pill">
                                    ${t2Winner ? '🏆 WINNER' : 'Select'}
                                </span>
                            </div>
                        </div>

                        <div class="court-reserves">
                            <strong>Reserves:</strong>
                            ${formatReservesTags(court.reserves)}
                        </div>
                    </article>
                `;
            }).join('');

            // Wire up interactive team tap targets
            document.querySelectorAll('.team-btn').forEach(btn => {
                btn.addEventListener('click', handleTeamClick);
            });

            // Wire up court delete buttons
            document.querySelectorAll('.btn-delete-court').forEach(btn => {
                btn.addEventListener('click', async (e) => {
                    const courtId = e.currentTarget.dataset.courtId;
                    const delRes = await fetch(`${API_BASE_URL}/${courtId}`, { method: 'DELETE' });
                    if (!delRes.ok) {
                        showError(await readError(delRes, 'Could not delete court'));
                        return;
                    }
                    await loadCourts();
                });
            });

            showError('');
        }

        async function handleTeamClick(e) {
            const teamBtn = e.currentTarget;
            const courtCard = teamBtn.closest('.court-card');
            const courtId = courtCard.dataset.courtId;
            const selectedTeam = teamBtn.dataset.team;

            // If already marked as winner, tapping again unselects it
            const isAlreadyWinner = teamBtn.classList.contains('winner');
            const newWinner = isAlreadyWinner ? '' : selectedTeam;

            // Optimistic UI update
            courtCard.querySelectorAll('.team-btn').forEach(btn => {
                const isSelected = (!isAlreadyWinner && btn.dataset.team === selectedTeam);
                btn.classList.toggle('winner', isSelected);
                const pill = btn.querySelector('.winner-pill');
                if (pill) {
                    pill.textContent = isSelected ? '🏆 WINNER' : 'Select';
                }
            });

            const res = await fetch(`${API_BASE_URL}/${courtId}/winner`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ winner: newWinner }),
            });

            if (!res.ok) {
                showError(await readError(res, 'Could not save match result'));
                await loadCourts();
            } else {
                showError('');
            }
        }

        // Add Reserve input row dynamically
        document.getElementById('addReserveBtn').addEventListener('click', () => {
            const container = document.getElementById('reservesInputs');
            const row = document.createElement('div');
            row.className = 'reserve-row';
            row.innerHTML = `
                <input type="text" class="reservePlayer" placeholder="Reserve player name">
                <button type="button" class="btn-remove-reserve" title="Remove">✕</button>
            `;
            row.querySelector('.btn-remove-reserve').addEventListener('click', () => row.remove());
            container.appendChild(row);
        });

        // Add Court Form submission
        document.getElementById('addCourtForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const team1 = {
                player1: document.getElementById('team1Player1').value.trim(),
                player2: document.getElementById('team1Player2').value.trim(),
            };
            const team2 = {
                player1: document.getElementById('team2Player1').value.trim(),
                player2: document.getElementById('team2Player2').value.trim(),
            };
            const reserves = Array.from(document.querySelectorAll('.reservePlayer'))
                .map(input => input.value.trim())
                .filter(name => name.length > 0);

            const res = await fetch(API_BASE_URL + '/add', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ team1, team2, reserves }),
            });

            if (!res.ok) {
                showError(await readError(res, 'Could not add court'));
                return;
            }

            e.target.reset();
            document.getElementById('reservesInputs').innerHTML = `
                <div class="reserve-row">
                    <input type="text" class="reservePlayer" placeholder="Reserve player name">
                </div>
            `;
            await loadCourts();
        });

        // Rotate to Next Matches submission
        document.getElementById('nextMatchesForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const res = await fetch(API_BASE_URL + '/calculate', { method: 'POST' });
            if (!res.ok) {
                showError(await readError(res, 'Could not rotate matches'));
                return;
            }
            await loadCourts();
        });

        // Reset Session Button
        document.getElementById('resetSessionBtn').addEventListener('click', async () => {
            if (!confirm('Are you sure you want to reset the session? This will remove all courts and reset to Round 1.')) {
                return;
            }
            const res = await fetch(API_BASE_URL + '/reset', { method: 'POST' });
            if (!res.ok) {
                showError(await readError(res, 'Could not reset session'));
                return;
            }
            await loadCourts();
        });

        // Initial Load
        loadCourts();
    </script>
</body>
</html>
