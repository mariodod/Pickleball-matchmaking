<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Court Management</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }
        h1 {
            color: #333;
        }
        form {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-top: 10px;
        }
        input, button {
            margin-top: 5px;
            padding: 8px;
            width: 100%;
            max-width: 300px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 8px;
            text-align: left;
        }
        th {
            background-color: #f4f4f4;
        }
        button {
            cursor: pointer;
        }
        .error {
            color: #b00020;
            margin: 10px 0;
        }
    </style>
</head>
<body>
<h1>Court Management</h1>
<p id="errorMessage" class="error" hidden></p>

<h2>Add a New Court</h2>
<form id="addCourtForm">
    <h2>Team 1</h2>
    <label for="team1Player1">Player 1:</label>
    <input type="text" id="team1Player1" name="team1Player1" required>

    <label for="team1Player2">Player 2:</label>
    <input type="text" id="team1Player2" name="team1Player2" required>

    <h2>Team 2</h2>
    <label for="team2Player1">Player 1:</label>
    <input type="text" id="team2Player1" name="team2Player1" required>

    <label for="team2Player2">Player 2:</label>
    <input type="text" id="team2Player2" name="team2Player2" required>

    <h2>Reserves</h2>
    <div class="reserves" id="reservesContainer">
        <input type="text" class="reservePlayer" placeholder="Reserve Player">
    </div>
    <button type="button" id="addReserve">Add Reserve Player</button>

    <button type="submit">Add Court</button>
</form>

<h2>Delete a Court</h2>
<form id="deleteCourtForm">
    <button type="submit">Delete Court</button>
</form>

<h2>Next Matches</h2>
<form id="nextMatchesForm">
    <button type="submit">Rotate to next matches</button>
</form>

<h2>Courts List</h2>
<table id="courtsTable">
    <thead>
    <tr>
        <th>ID</th>
        <th>Team 1</th>
        <th>Team 2</th>
        <th>Reserves</th>
        <th>Winner</th>
    </tr>
    </thead>
    <tbody>
    </tbody>
</table>

<script>
    const API_BASE_URL = '/courts';

    function showError(message) {
        const el = document.getElementById('errorMessage');
        if (!message) {
            el.hidden = true;
            el.textContent = '';
            return;
        }
        el.hidden = false;
        el.textContent = message;
    }

    async function readError(response, fallback) {
        try {
            const body = await response.json();
            return body.message || body.detail || fallback;
        } catch {
            return fallback;
        }
    }

    function formatReserves(reserves) {
        if (!reserves) {
            return '';
        }
        if (Array.isArray(reserves)) {
            return reserves.join(', ');
        }
        return String(reserves);
    }

    async function loadCourts() {
        const response = await fetch(API_BASE_URL);
        if (!response.ok) {
            showError(await readError(response, 'Could not load courts'));
            return;
        }
        const courts = await response.json();
        const tableBody = document.querySelector('#courtsTable tbody');
        tableBody.innerHTML = courts.map(court => `
                <tr data-court-id="${court.id}">
                    <td>${court.id + 1}</td>
                    <td>${court.team1.player1}, ${court.team1.player2}</td>
                    <td>${court.team2.player1}, ${court.team2.player2}</td>
                    <td>${formatReserves(court.reserves)}</td>
                    <td>
                        <label>
                            Team 1
                            <input type="checkbox" class="winner-checkbox" data-team="team1" ${court.team1Win ? 'checked' : ''}>
                        </label>
                        <label>
                            Team 2
                            <input type="checkbox" class="winner-checkbox" data-team="team2" ${court.team2Win ? 'checked' : ''}>
                        </label>
                    </td>
                </tr>
            `).join('');

        document.querySelectorAll('.winner-checkbox').forEach(checkbox => {
            checkbox.addEventListener('change', handleWinnerSelection);
        });
        showError('');
    }

    document.getElementById('addReserve').addEventListener('click', () => {
        const reservesContainer = document.getElementById('reservesContainer');
        const newInput = document.createElement('input');
        newInput.type = 'text';
        newInput.className = 'reservePlayer';
        newInput.placeholder = 'Reserve Player';
        reservesContainer.appendChild(newInput);
    });

    document.getElementById('addCourtForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const team1 = {
            player1: document.getElementById('team1Player1').value,
            player2: document.getElementById('team1Player2').value,
        };
        const team2 = {
            player1: document.getElementById('team2Player1').value,
            player2: document.getElementById('team2Player2').value,
        };
        const reserves = Array.from(document.querySelectorAll('.reservePlayer'))
            .map(input => input.value)
            .filter(value => value.trim() !== '');

        const response = await fetch(API_BASE_URL + '/add', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ team1, team2, reserves }),
        });
        if (!response.ok) {
            showError(await readError(response, 'Could not add court'));
            return;
        }
        e.target.reset();
        document.getElementById('reservesContainer').innerHTML =
            '<input type="text" class="reservePlayer" placeholder="Reserve Player">';
        await loadCourts();
    });

    document.getElementById('deleteCourtForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const response = await fetch(API_BASE_URL + '/delete', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' }
        });
        if (!response.ok) {
            showError(await readError(response, 'Could not delete court'));
            return;
        }
        await loadCourts();
    });

    document.getElementById('nextMatchesForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const response = await fetch(API_BASE_URL + '/calculate', { method: 'POST' });
        if (!response.ok) {
            showError(await readError(response, 'Could not rotate matches'));
            return;
        }
        await loadCourts();
    });

    async function handleWinnerSelection(event) {
        const checkbox = event.target;
        const courtId = checkbox.closest('tr').dataset.courtId;
        const winner = checkbox.checked ? checkbox.dataset.team : '';

        checkbox.closest('td').querySelectorAll('.winner-checkbox').forEach(cb => {
            if (cb !== checkbox) {
                cb.checked = false;
            }
        });

        const response = await fetch(`${API_BASE_URL}/${courtId}/winner`, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ winner }),
        });
        if (!response.ok) {
            showError(await readError(response, 'Could not save winner'));
            await loadCourts();
        }
    }

    loadCourts();
</script>
</body>
</html>
